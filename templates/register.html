{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-6 col-lg-5">
        
        <div class="card shadow border-0 rounded-4 overflow-hidden">
            <div class="card-header bg-primary text-white text-center py-4 border-0">
                <i class="fa-solid fa-user-plus fa-3x mb-3"></i>
                <h2 class="fw-bold m-0">Citizen Registration</h2>
                <p class="small opacity-75 mb-0">Join the District Public Grievance Portal</p>
            </div>
            
            <div class="card-body p-4 p-md-5">
                <form action="/register" method="POST">
                    
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">FULL NAME</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-id-card text-muted"></i></span>
                            <input type="text" name="name" class="form-control border-start-0 ps-0" placeholder="e.g. Vikas Kumar" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">EMAIL ADDRESS</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                            <input type="email" name="email" class="form-control border-start-0 ps-0" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">CREATE PASSWORD</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm">
                            Create Account
                        </button>
                    </div>
                </form>
            </div>
            
            <div class="card-footer bg-light text-center py-3 border-0">
                <span class="text-muted">Already have an account?</span> 
                <a href="/login" class="text-decoration-none fw-bold text-primary">Sign In</a>
            </div>
        </div>

        <div class="text-center mt-4 px-3">
            <p class="text-muted" style="font-size: 0.75rem;">
                By registering, you agree to provide truthful information. 
                Misuse of the portal is a punishable offense.
            </p>
        </div>

    </div>
</div>

{% endblock %}
