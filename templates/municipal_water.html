{% extends "base.html" %}
{% block content %}

<nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb bg-light p-2 rounded shadow-sm">
        <li class="breadcrumb-item"><a href="/dashboard" class="text-decoration-none text-success">Dashboard</a></li>
        <li class="breadcrumb-item"><a href="/municipal" class="text-decoration-none text-success">Municipal Services</a></li>
        <li class="breadcrumb-item active" aria-current="page">Water & Sanitation</li>
    </ol>
</nav>

<div class="text-center mb-5">
    <h2 class="display-6 fw-bold text-dark">Water & Sanitation</h2>
    <p class="text-muted">Report public health or utility issues related to water and waste</p>
</div>

<div class="row g-4 justify-content-center">
    
    <div class="col-6 col-md-4 col-lg-3">
        <a href="/complaint/municipal/sewage" class="card h-100 text-decoration-none service-tile shadow-sm">
            <div class="card-body text-center p-4">
                <div class="icon-box mb-3">
                    <img src="/static/images/sewage.png" alt="Sewage" class="img-fluid">
                </div>
                <h6 class="fw-bold text-dark m-0">Sewage Overflow</h6>
            </div>
        </a>
    </div>

    <div class="col-6 col-md-4 col-lg-3">
        <a href="/complaint/municipal/garbage" class="card h-100 text-decoration-none service-tile shadow-sm">
            <div class="card-body text-center p-4">
                <div class="icon-box mb-3">
                    <img src="/static/images/garbage.png" alt="Garbage" class="img-fluid">
                </div>
                <h6 class="fw-bold text-dark m-0">Garbage Collection</h6>
            </div>
        </a>
    </div>

    <div class="col-6 col-md-4 col-lg-3">
        <a href="/complaint/municipal/water_leak" class="card h-100 text-decoration-none service-tile shadow-sm">
            <div class="card-body text-center p-4">
                <div class="icon-box mb-3">
                    <img src="/static/images/water_leak.png" alt="Water Leak" class="img-fluid">
                </div>
                <h6 class="fw-bold text-dark m-0">Water Leakage</h6>
            </div>
        </a>
    </div>

    <div class="col-6 col-md-4 col-lg-3">
        <a href="/complaint/municipal/contaminated" class="card h-100 text-decoration-none service-tile shadow-sm">
            <div class="card-body text-center p-4">
                <div class="icon-box mb-3">
                    <img src="/static/images/contaminated.png" alt="Contaminated" class="img-fluid">
                </div>
                <h6 class="fw-bold text-dark m-0">Contaminated Water</h6>
            </div>
        </a>
    </div>

</div>

<style>
    .service-tile {
        transition: all 0.3s ease;
        border-radius: 15px;
        border: 1.5px solid #eee;
        background: white;
    }
    .service-tile:hover {
        transform: translateY(-5px);
        background-color: #f0fdf4; /* Very light green tint */
        border-color: #198754;
    }
    .icon-box {
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
    }
    .icon-box img {
        max-height: 100%;
        max-width: 100%;
        object-fit: contain;
    }
</style>

{% endblock %}
