{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card shadow border-0 rounded-4 overflow-hidden">
            <div class="card-header bg-primary text-white p-4 border-0">
                <h3 class="fw-bold m-0"><i class="fa-solid fa-pen-to-square me-2"></i>Register Complaint</h3>
                <span class="badge bg-light text-primary mt-2">{{ department | upper }} / {{ category | upper }}</span>
            </div>

            <div class="card-body p-4 p-md-5">
                <form method="post" enctype="multipart/form-data">
                    <div class="row g-5">
                        <div class="col-md-6">
                            <div class="mb-4">
                                <label class="form-label fw-bold small text-muted">INCIDENT DESCRIPTION</label>
                                <textarea name="description" class="form-control" rows="5" placeholder="Describe the issue..." required></textarea>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold small text-muted">LOCATION (GPS)</label>
                                <div class="input-group">
                                    <input type="text" name="location" id="location" class="form-control" placeholder="Coordinates" required>
                                    <button type="button" class="btn btn-dark" onclick="getLocation()"><i class="fa-solid fa-crosshairs"></i></button>
                                </div>
                                <div id="map" class="mt-2 rounded bg-light border" style="height: 200px;"></div>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">EVIDENCE (LIVE CAMERA)</label>
                            <div class="position-relative bg-black rounded overflow-hidden mb-3" style="aspect-ratio: 4/3;">
                                <video id="video" class="w-100 h-100" style="object-fit: cover;" autoplay></video>
                                <button type="button" class="btn btn-danger position-absolute bottom-0 start-50 translate-middle-x mb-3 w-75 fw-bold shadow" onclick="capturePhoto()">
                                    <i class="fa-solid fa-camera me-2"></i>CAPTURE PHOTO
                                </button>
                            </div>

                            <div class="row g-2">
                                <div class="col-6 text-center">
                                    <small class="text-muted d-block">PREVIEW</small>
                                    <img id="preview" class="img-thumbnail" style="height: 100px; width: 100%; object-fit: cover;">
                                    <input type="hidden" name="image_data" id="image_data">
                                </div>
                                <div class="col-6">
                                    <small class="text-muted d-block">OR UPLOAD FILE</small>
                                    <input type="file" name="image" class="form-control form-control-sm" accept="image/*">
                                </div>
                            </div>

                            <div class="d-grid mt-5">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold shadow">SUBMIT COMPLAINT</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<canvas id="canvas" width="400" height="300" style="display:none;"></canvas>

<script>
// START CAMERA
window.onload = function(){
    const video = document.getElementById("video");
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then(stream => { video.srcObject = stream; })
    .catch(() => { console.log("Camera access blocked"); });
};

// CAPTURE PHOTO TO HIDDEN INPUT
function capturePhoto(){
    let video = document.getElementById("video");
    let canvas = document.getElementById("canvas");
    let context = canvas.getContext("2d");
    context.drawImage(video, 0, 0, 400, 300);
    
    let imageData = canvas.toDataURL("image/png");
    document.getElementById("image_data").value = imageData; // SENDS TO PYTHON
    document.getElementById("preview").src = imageData;      // SHOWS USER
}

// GPS LOCATION
function getLocation(){
    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(pos => {
            let loc = pos.coords.latitude + "," + pos.coords.longitude;
            document.getElementById("location").value = loc;
            document.getElementById("map").innerHTML = `<iframe width="100%" height="200" src="https://maps.google.com/maps?q=${loc}&z=15&output=embed"></iframe>`;
        });
    }
}
</script>
{% endblock %}
