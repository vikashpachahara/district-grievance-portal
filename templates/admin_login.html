{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-5 col-lg-4">
        
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            
            <div class="card-header bg-dark text-white text-center py-5 border-0">
                <div class="mb-3">
                    <i class="fa-solid fa-user-shield fa-3x"></i>
                </div>
                <h3 class="fw-bold m-0 text-uppercase tracking-wider">Official Access</h3>
                <p class="small opacity-75 mb-0">District Administration Login</p>
            </div>
            
            <div class="card-body p-4 p-md-5">
                <form action="/admin" method="POST">
                    
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">ADMINISTRATOR ID</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-id-badge text-muted"></i></span>
                            <input type="email" name="username" class="form-control border-start-0 ps-0" 
                                   placeholder="admin@gov.in" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">SECURITY PASSWORD</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-key text-muted"></i></span>
                            <input type="password" name="password" class="form-control border-start-0 ps-0" 
                                   placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-dark btn-lg fw-bold shadow-sm">
                            <i class="fa-solid fa-right-to-bracket me-2"></i>Authorize Entry
                        </button>
                    </div>
                </form>
            </div>
            
            <div class="card-footer bg-light text-center py-3 border-0">
                <small class="text-danger fw-bold italic" style="font-size: 0.7rem;">
                    <i class="fa-solid fa-triangle-exclamation me-1"></i> UNAUTHORIZED ACCESS IS PROHIBITED
                </small>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="/login" class="text-decoration-none text-muted small">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Citizen Login
            </a>
        </div>

    </div>
</div>

{% endblock %}
