{% extends "base.html" %}
{% block content %}

<div class="text-center mb-5">
    <div class="badge bg-danger px-3 py-2 mb-2 shadow-sm pulse-animation">CRITICAL SERVICES</div>
    <h2 class="display-6 fw-bold text-danger">Emergency Assistance</h2>
    <p class="text-muted">Immediate response for life-threatening or urgent situations</p>
</div>

<div class="row g-4 justify-content-center">
    
    <div class="col-6 col-md-4 col-lg-3">
        <a href="/complaint/emergency/ambulance" class="card h-100 text-decoration-none service-tile shadow-sm border-danger">
            <div class="card-body text-center p-4">
                <div class="icon-box mb-3">
                    <img src="/static/images/ambulance.png" alt="Ambulance" class="img-fluid">
                </div>
                <h6 class="fw-bold text-dark m-0">Ambulance</h6>
            </div>
        </a>
    </div>

    <div class="col-6 col-md-4 col-lg-3">
        <a href="/complaint/emergency/fire" class="card h-100 text-decoration-none service-tile shadow-sm border-danger">
            <div class="card-body text-center p-4">
                <div class="icon-box mb-3">
                    <img src="/static/images/fire.png" alt="Fire" class="img-fluid">
                </div>
                <h6 class="fw-bold text-dark m-0">Fire Brigade</h6>
            </div>
        </a>
    </div>

    <div class="col-6 col-md-4 col-lg-3">
        <a href="/complaint/emergency/road_assistance" class="card h-100 text-decoration-none service-tile shadow-sm">
            <div class="card-body text-center p-4">
                <div class="icon-box mb-3">
                    <img src="/static/images/road_assistance.png" alt="Road Assistance" class="img-fluid">
                </div>
                <h6 class="fw-bold text-dark m-0">Road Assistance</h6>
            </div>
        </a>
    </div>

    <div class="col-6 col-md-4 col-lg-3">
        <a href="/sos" class="card h-100 text-decoration-none service-tile shadow-lg border-danger bg-danger">
            <div class="card-body text-center p-4">
                <div class="icon-box mb-3">
                    <img src="/static/images/sos.png" alt="SOS" class="img-fluid brightness-filter">
                </div>
                <h6 class="fw-bold text-white m-0">SOS EMERGENCY</h6>
            </div>
        </a>
    </div>

    <div class="col-6 col-md-4 col-lg-3">
        <a href="/complaint/emergency/other" class="card h-100 text-decoration-none service-tile shadow-sm">
            <div class="card-body text-center p-4">
                <div class="icon-box mb-3">
                    <img src="/static/images/other.png" alt="Other" class="img-fluid">
                </div>
                <h6 class="fw-bold text-dark m-0">Other Emergency</h6>
            </div>
        </a>
    </div>

</div>

<style>
    .service-tile {
        transition: all 0.3s ease;
        border-radius: 20px;
        background: white;
    }
    .service-tile:hover {
        transform: scale(1.05);
        box-shadow: 0 10px 20px rgba(220, 53, 69, 0.2) !important;
    }
    .icon-box {
        height: 90px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .icon-box img {
        max-height: 100%;
        max-width: 100%;
        object-fit: contain;
    }
    .brightness-filter {
        filter: brightness(0) invert(1); /* Makes the SOS icon white for the red background */
    }
    .pulse-animation {
        animation: pulse 2s infinite;
    }
    @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.5; }
        100% { opacity: 1; }
    }
</style>

{% endblock %}
